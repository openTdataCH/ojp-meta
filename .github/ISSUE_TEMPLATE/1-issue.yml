name: OJP Incident
description: Report a problem or issue with OJP
title: "[OJP Bug]: "
labels:
  - ojp-incident

assignees:
  - vasile
  - AndreasAtSBB

body:
  - type: input
    id: organisation
    attributes:
      label: Organisation
      placeholder: SBB / BLS / ZVV / other
    validations:
      required: true

  - type: dropdown
    id: stage
    attributes:
      label: Stage
      options:
        - PROD
        - INT
        - TEST
    validations:
      required: true

  - type: dropdown
    id: version
    attributes:
      label: Version
      options:
        - OJP v2
        - OJP v1
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: Details
      description: Describe the issue in detail
      placeholder: |
        What happened?
        What did you expect?
        Steps to reproduce ...
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostic information
      description: "Warning: If this field is prefilled, do not edit it. A GitHub issue-form bug can overwrite your changes with the original text. Use Details above for your description."
      placeholder: |
        Page URL, OJP and SDK versions, browser and screen information
        Request / response XML URLs
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Drag & drop screenshots or paste images here
      placeholder: Attach screenshots if relevant
    validations:
      required: false
